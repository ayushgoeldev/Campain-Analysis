<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Lead Report</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #0c1017;
      --panel: #151b26;
      --panel-2: #1a2130;
      --ink: #e8ecf4;
      --muted: #7f8ca3;
      --line: #232c3b;
      --accent: #5b8cff;
      --accent-2: #7aa2ff;
      --accent-soft: rgba(91, 140, 255, .14);
      --danger: #ff6b6b;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      font-family: var(--font); color: var(--ink);
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(91, 140, 255, .13), transparent 60%),
        radial-gradient(760px 440px at -10% 20%, rgba(53, 211, 154, .07), transparent 55%),
        var(--bg);
    }
    .login {
      width: min(100%, 390px); background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line); border-radius: 14px; padding: 28px;
      box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.32);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand img { width: 44px; height: 44px; display: block; }
    h1 { font-size: 22px; margin: 0; line-height: 1.1; }
    p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    label { display: grid; gap: 6px; margin-bottom: 14px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px;
      background: #0f141d; color: var(--ink); font: inherit;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button {
      width: 100%; border: 0; border-radius: 9px; padding: 11px 14px; cursor: pointer;
      color: #fff; font: inherit; font-weight: 800;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 2px 10px rgba(91, 140, 255, .35);
    }
    button:disabled { opacity: .65; cursor: default; }
    .error { min-height: 19px; margin-top: 12px; color: var(--danger); font-size: 13px; }
  </style>
</head>
<body>
  <form class="login" id="loginForm">
    <div class="brand">
      <img src="/logo.svg" alt="" />
      <div>
        <h1>Lead Report</h1>
        <p>Sign in to continue</p>
      </div>
    </div>
    <label>
      ID
      <input name="username" autocomplete="username" required autofocus />
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Login</button>
    <div class="error" id="error"></div>
  </form>

  <script>
    const form = document.querySelector('#loginForm');
    const error = document.querySelector('#error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      error.textContent = '';
      try {
        const body = Object.fromEntries(new FormData(form));
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/';
      } catch (err) {
        error.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
