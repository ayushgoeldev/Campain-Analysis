# Spin up a local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: leadreport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadreport
    ports:
      - "5432:5432"
    volumes:
      - leadreport_pgdata:/var/lib/postgresql/data

volumes:
  leadreport_pgdata:
